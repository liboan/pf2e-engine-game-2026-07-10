schema: pf2e-successor-project-registry.v1

project:
  id: pf2e-engine-game-2026-07-10
  phase: design
  product_scope:
    distribution: private
    client_model: single-client
  rules_boundary:
    family: remaster
    sole_working_authority: archives-of-nethys
    retrieval_cutoff: "2026-07-10"
    content_allowlist:
      - title: Player Core
        aon_source_id: 216
        url: https://2e.aonprd.com/Sources.aspx?ID=216
      - title: Player Core 2
        aon_source_id: 227
        url: https://2e.aonprd.com/Sources.aspx?ID=227
      - title: Monster Core
        aon_source_id: 221
        url: https://2e.aonprd.com/Sources.aspx?ID=221
      - title: NPC Core
        aon_source_id: 236
        url: https://2e.aonprd.com/Sources.aspx?ID=236
    core_encounter_rules:
      allow_other_aon_pages_when_required: true
      bulk_gm_core_content_import: false
    foundry:
      role: optional-engineering-cross-check
      required: false
      rules_authority: false

vocabularies:
  clause_disposition:
    - mapped
    - non-executable
    - excluded
    - unsupported
  definition_lifecycle:
    - candidate
    - supported
    - retired
  evidence_dimensions:
    - source-reviewed
    - isolated
    - generalization
    - production-path
    - continuous
    - client
    - performance
  generalization_not_applicable_value: "N/A"

routes:
  rules_profiles: registry/rules-profiles/
  source_records: registry/source-records/
  oracles: registry/oracles/
  behavior_inventory_template: registry/definitions/{definition_id}/behavior-inventory.yaml
  capability_support: registry/capabilities/
  packages: registry/packages/
  live_ledger: registry/project.yaml#/live_ledger
  approvals: registry/approvals/
  durable_evidence_manifests: registry/evidence/
  verifier_holdout_index: registry/holdouts/index.yaml
  verifier_holdout_payloads: verifier-owned-external-store

record_shapes:
  approval_entry:
    required_fields:
      - id
      - approver
      - scope
      - commit
      - affected_record_ids
      - batch
      - outcome

indexes:
  rules_profiles: []
  source_records: []
  oracles: []
  behavior_inventories: []
  capabilities: []
  packages: []
  approvals: []
  durable_evidence_manifests: []
  verifier_holdouts: []

live_ledger:
  integration_commit: null
  rules_profile_id: null
  production_package_ids: []
  work_packages: []

production_gate:
  allowed_definition_lifecycle:
    - supported
  require_closed_behavior_inventory: true
  forbidden_clause_dispositions:
    - unsupported
  require_exact_profile_content_module_and_approval_digests: true
  require_evidence_manifest_ids: true
  required_evidence_dimensions:
    - source-reviewed
    - isolated
    - generalization
    - production-path
    - continuous
    - client
    - performance
  generalization_na_requires_reason: true

holdout_policy:
  shared_workspace_contains_unrevealed_payload: false
  verifier_controls_access_execution_reveal_and_replacement: true
  select_after_frozen_commit_when_protected_storage_is_unavailable: true
  revealed_case_becomes_regression: true
  replacement_required_after_reveal_when_tier_requires_holdout: true
