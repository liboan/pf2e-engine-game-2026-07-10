[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pf2e-s1-engine"
version = "0.1.0"
description = "A small local Pathfinder 2e encounter engine prototype"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pf2e = "pf2e.terminal:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
