name: trusted-policy

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  approved-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: trusted
      - name: Check out proposed tree as data
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: proposed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: trusted/requirements-quality.txt
      - name: Install dependencies approved on the base
        run: python -m pip install -e trusted -r trusted/requirements-quality.txt
      - name: Place trusted configs beside the proposed sources
        run: |
          cp trusted/.pylintrc proposed/.trusted-pylintrc
          cp trusted/pyrightconfig.json proposed/.trusted-pyrightconfig.json
      - name: Run the base implementation against the proposed tree
        env:
          PF2E_REPO_ROOT: ${{ github.workspace }}/proposed
        run: >-
          python trusted/tools/quality_gate.py
          --trusted-ref ${{ github.event.pull_request.base.sha }}
          --policy ${{ github.workspace }}/trusted/.quality/baseline.json
          --pylint-config ${{ github.workspace }}/proposed/.trusted-pylintrc
          --pyright-config ${{ github.workspace }}/proposed/.trusted-pyrightconfig.json
          --requirements ${{ github.workspace }}/trusted/requirements-quality.txt
